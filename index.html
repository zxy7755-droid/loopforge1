<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    /* 内联、极简，无外部资源依赖 */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f5f5f5;
    }
    main {
      text-align: center;
      padding: 1rem;
      max-width: 100%;
      box-sizing: border-box;
    }
    h1 {
      font-size: clamp(1.5rem, 8vw, 3rem);
      color: #222;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello World</h1>
  </main>
</body>
</html>
